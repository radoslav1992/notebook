# Еднократна настройка на нещата, които Cloudflare dashboard не може:
# Vectorize индекса, двата му индекса по метаданни, и таблиците в D1.
#
# Пуска се от браузъра: Actions → „Настройка на Cloudflare ресурсите“ →
# Run workflow. Без терминал.
#
# Нужни са две неща в Settings → Secrets and variables → Actions:
#   CLOUDFLARE_API_TOKEN   — token с права Vectorize:Edit и D1:Edit
#   CLOUDFLARE_ACCOUNT_ID  — Account ID от Cloudflare
#
# Може да се пуска пак без страх: всяка стъпка минава спокойно, ако вече е
# направена.

name: Настройка на Cloudflare ресурсите

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: 'Приложи миграциите в D1 (таблиците)'
        type: boolean
        default: true
      create_vectorize:
        description: 'Направи Vectorize индекса и индексите по метаданни'
        type: boolean
        default: true

concurrency:
  group: cloudflare-setup
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      INDEX: zapiski-chunks
      DATABASE: zapiski

    steps:
      - name: Проверка на тайните
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Липсва тайната $name. Добави я в Settings → Secrets and variables → Actions."
              missing=1
            fi
          done
          exit $missing

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Инсталиране
        run: npm ci

      # ── Vectorize ────────────────────────────────────────────────────────
      # 1536 измерения. `gemini-embedding-001` дава 3072 по подразбиране, но
      # поддържа съкращаване (Matryoshka) — приложението иска 1536 и нормализира
      # наново. Числото трябва да съвпада с EMBED_DIMENSIONS в
      # src/lib/constants.ts; смяната изисква нов индекс, защото ширината на
      # съществуващ не се мени.
      # Идемпотентно: `get` казва дали индексът вече го има, а ако `create`
      # падне (например защото е бил направен междувременно), проверяваме пак и
      # се провалваме само ако наистина липсва.
      - name: Vectorize индекс
        if: ${{ inputs.create_vectorize }}
        run: |
          if npx wrangler vectorize get "$INDEX" > /dev/null 2>&1; then
            echo "Индексът $INDEX вече съществува — пропускам създаването."
          elif npx wrangler vectorize create "$INDEX" --dimensions=1536 --metric=cosine; then
            echo "Индексът $INDEX е създаден."
          elif npx wrangler vectorize get "$INDEX" > /dev/null 2>&1; then
            echo "Създаването върна грешка, но индексът съществува — продължавам."
          else
            echo "::error::Индексът $INDEX не съществува и не можа да бъде създаден."
            echo "::error::Провери дали token-ът има Account · Vectorize · Edit."
            npx wrangler vectorize create "$INDEX" --dimensions=1536 --metric=cosine
            exit 1
          fi
          # Само нашият индекс се пипа; други индекси в акаунта остават както са.
          echo "Индекси в акаунта (нищо друго не се променя):"
          npx wrangler vectorize list || true

      # Без тези филтрирането по тетрадка и по избрани източници не работи в
      # индекса и приложението минава на резервния път — работи, но губи
      # точност, когато индексът порасне. Правят се ПРЕДИ първия качен източник:
      # Vectorize индексира по метаданни само вектори, добавени след това.
      - name: Индекси по метаданни
        if: ${{ inputs.create_vectorize }}
        run: |
          existing="$(npx wrangler vectorize list-metadata-index "$INDEX" 2>/dev/null || true)"
          for property in notebookId sourceId; do
            echo "── $property"
            if printf '%s' "$existing" | grep -q "$property"; then
              echo "  вече съществува"
            elif npx wrangler vectorize create-metadata-index "$INDEX" \
                   --propertyName="$property" --type=string; then
              echo "  създаден"
            else
              echo "::warning::Индексът по метаданни за $property не беше създаден."
              echo "::warning::Приложението ще работи, но търсенето губи точност при много тетрадки."
            fi
          done

      - name: Какво има в индекса сега
        if: ${{ inputs.create_vectorize }}
        run: |
          npx wrangler vectorize get "$INDEX" || true
          npx wrangler vectorize list-metadata-index "$INDEX" || true

      # ── D1 ───────────────────────────────────────────────────────────────
      # Базата се създава при deploy на worker-а; тук се правят таблиците.
      - name: Миграции в D1
        if: ${{ inputs.apply_migrations }}
        run: npx wrangler d1 migrations apply "$DATABASE" --remote

      - name: Проверка на таблиците
        if: ${{ inputs.apply_migrations }}
        run: |
          npx wrangler d1 execute "$DATABASE" --remote --json --command \
            "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name"

      - name: Готово
        run: |
          echo "### Настройката мина" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Остава да добавиш тайните на самия worker в Cloudflare:" >> "$GITHUB_STEP_SUMMARY"
          echo "**Settings → Variables and Secrets** → \`GEMINI_API_KEY\` и \`SESSION_SECRET\`." >> "$GITHUB_STEP_SUMMARY"
